name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare optional signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CARCHI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/carchi-release.jks"
            echo "CARCHI_KEYSTORE_PATH=$RUNNER_TEMP/carchi-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        env:
          CARCHI_KEYSTORE_PASSWORD: ${{ secrets.CARCHI_KEYSTORE_PASSWORD }}
          CARCHI_KEY_ALIAS: ${{ secrets.CARCHI_KEY_ALIAS }}
          CARCHI_KEY_PASSWORD: ${{ secrets.CARCHI_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/carchi-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/carchi-release.apk
          fi
          ls -lh out

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: carchi-release-apks
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          generate_release_notes: true
